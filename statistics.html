<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Current-season college and high-school Sim Wrestling statistics.">
    <title>Statistics | Sim Wrestling</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body data-page="statistics">
    <div data-site-header></div>
    <main class="page-shell">
      <section class="page-heading directory-heading">
        <div><p class="eyebrow">Media center</p><h1>Public Statistics</h1><p>Season results and traditionally tracked wrestling statistics.</p></div>
        <div class="directory-filters" aria-label="Statistics filters">
          <label class="filter-control">Level
            <select id="statistics-level-filter" disabled><option value="COLLEGE">College</option><option value="HIGH_SCHOOL">High School</option></select>
          </label>
          <label class="filter-control">Weight class
            <select id="statistics-weight-filter" disabled><option value="125">125 lb</option></select>
          </label>
          <label class="filter-control" id="statistics-region-control">Region
            <select id="statistics-region-filter" disabled><option value="ALL">All regions · National</option></select>
          </label>
          <label class="filter-control" id="statistics-state-control">State
            <select id="statistics-state-filter" disabled><option value="ALL">All states</option></select>
          </label>
          <label class="filter-control" id="statistics-county-control" hidden>County
            <select id="statistics-county-filter" disabled><option value="ALL">All counties</option></select>
          </label>
          <label class="filter-control" id="statistics-locality-control" hidden>Town / City
            <select id="statistics-locality-filter" disabled><option value="ALL">All towns and cities</option></select>
          </label>
          <label class="filter-control search-control">Search wrestler or college
            <input id="statistics-search" type="search" placeholder="Start typing a name or college" autocomplete="off">
          </label>
        </div>
      </section>
      <nav class="statistics-tabs" aria-label="Statistics sections">
        <button class="statistics-tab active" type="button" data-statistics-view="results">Results</button>
        <button class="statistics-tab" type="button" data-statistics-view="performance">Match Performance</button>
      </nav>
      <section class="panel table-panel">
        <div class="panel-heading"><div><p class="eyebrow">All wrestlers</p><h2 id="statistics-title">Season Results</h2></div><span class="record-pill" id="statistics-count">Loading…</span></div>
        <div id="statistics-content" aria-live="polite"><div class="state-card"><span class="spinner" aria-hidden="true"></span><p>Loading statistics…</p></div></div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/site.js"></script><script src="js/statistics.js"></script>
  </body>
</html>
