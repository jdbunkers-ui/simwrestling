<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Public media statistics for every Sim Wrestling athlete.">
    <title>Statistics | Sim Wrestling</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body data-page="statistics">
    <div data-site-header></div>
    <main class="page-shell">
      <section class="page-heading compact-heading">
        <div><p class="eyebrow">Media center</p><h1>Public Statistics</h1><p>Season results and traditionally tracked wrestling statistics.</p></div>
        <label class="filter-control">Weight class
          <select id="statistics-weight-filter" disabled><option value="ALL">All weights</option></select>
        </label>
      </section>
      <section class="panel table-panel">
        <div class="panel-heading"><div><p class="eyebrow">All wrestlers</p><h2>Performance Leaders</h2></div><span class="record-pill" id="statistics-count">Loading…</span></div>
        <div id="statistics-content" aria-live="polite"><div class="state-card"><span class="spinner" aria-hidden="true"></span><p>Loading statistics…</p></div></div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/site.js"></script><script src="js/statistics.js"></script>
  </body>
</html>
