<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Current college team and wrestler rankings.">
    <title>Rankings | Sim Wrestling</title>
    <link rel="stylesheet" href="assets/styles.css?v=5.1.0">
  </head>
  <body data-page="rankings">
    <div data-site-header></div>
    <main class="page-shell">
      <section class="page-heading directory-heading">
        <div><p class="eyebrow">Current season · <span id="ranking-season">Loading</span></p><h1 id="directory-page-title">College Rankings</h1><p id="directory-page-copy">Current college wrestlers ranked across every program and weight class.</p></div>
        <div class="directory-filters rankings-simplified" aria-label="Ranking filters">
          <label class="filter-control">Rankings
            <select id="weight-filter" disabled><option value="TEAM">Teams</option></select>
          </label>
          <label class="filter-control">Geography
            <select id="geography-filter" disabled><option value="ALL">All Regions (National)</option></select>
          </label>
        </div>
      </section>
      <section class="panel table-panel" aria-labelledby="rankings-title">
        <div class="panel-heading"><div><p class="eyebrow">Current standings</p><h2 id="rankings-title">Overall Rankings</h2></div><span class="record-pill" id="ranking-count">Loading…</span></div>
        <div id="rankings-content" aria-live="polite">
          <div class="state-card"><span class="spinner" aria-hidden="true"></span><p>Loading rankings…</p></div>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="js/config.js"></script><script src="js/api.js?v=5.0.4"></script><script src="js/site.js?v=5.1.0"></script><script src="js/auth.js?v=4.0.0"></script><script src="js/rankings.js?v=5.0.4"></script>
  </body>
</html>
