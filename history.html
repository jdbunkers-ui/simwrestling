<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="College championship history for Sim Wrestling.">
    <title>History | Sim Wrestling</title>
    <link rel="stylesheet" href="assets/styles.css?v=3.9.0">
  </head>
  <body data-page="history">
    <div data-site-header></div>
    <main class="page-shell history-page">
      <section class="page-heading directory-heading">
        <div>
          <p class="eyebrow">Completed seasons · <span id="history-latest-season">Loading</span></p>
          <h1>College Championship History</h1>
          <p>State, regional and national individual placements and dual-team finishes.</p>
        </div>
        <div class="directory-filters" aria-label="History filters">
          <label class="filter-control">Level
            <select id="history-level" disabled><option value="COLLEGE">College</option></select>
          </label>
          <label class="filter-control">View
            <select id="history-weight" disabled><option value="TEAM">Team Champions</option></select>
          </label>
          <label class="filter-control">Region
            <select id="history-region" disabled><option value="MID_ATLANTIC">Mid-Atlantic Region</option></select>
          </label>
          <label class="filter-control">State
            <select id="history-state" disabled><option value="ALL">All states</option></select>
          </label>
          <label class="filter-control search-control">Search wrestler or college
            <input id="history-search" type="search" placeholder="Start typing a wrestler or college" autocomplete="off">
          </label>
        </div>
      </section>
      <section class="panel table-panel">
        <div class="panel-heading"><div><p class="eyebrow" id="history-scope">College history</p><h2 id="history-title">Championship Placements</h2></div><span class="record-pill" id="history-count">Loading…</span></div>
        <div id="history-root" aria-live="polite"><div class="state-card"><span class="spinner" aria-hidden="true"></span><p>Loading history…</p></div></div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="js/config.js"></script><script src="js/api.js?v=3.9.0"></script><script src="js/site.js?v=3.7.0"></script><script src="js/history.js?v=3.9.0"></script>
  </body>
</html>
