<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Current-season Sim Wrestling dual-meet and tournament results.">
    <title>Results | Sim Wrestling</title>
    <link rel="stylesheet" href="assets/styles.css?v=3.7.0">
  </head>
  <body data-page="results">
    <div data-site-header></div>
    <main class="page-shell results-page">
      <section class="page-heading results-heading">
        <div>
          <p class="eyebrow" id="results-season">Current season</p>
          <h1>Results</h1>
          <p>Review completed and in-progress dual meets and tournaments from the current season.</p>
        </div>
      </section>

      <section class="results-filter-panel panel" aria-label="Results filters">
        <div class="results-filters">
          <label class="filter-control">Level
            <select id="results-level">
              <option value="COLLEGE">College</option>
              <option value="HIGH_SCHOOL">High School</option>
            </select>
          </label>
          <label class="filter-control">View
            <select id="results-weight"><option value="125">125 lb</option></select>
          </label>
          <label class="filter-control">Region
            <select id="results-region"><option value="ALL">All regions · National</option></select>
          </label>
          <label class="filter-control">State
            <select id="results-state"><option value="ALL">All states</option></select>
          </label>
          <label class="filter-control">Week
            <select id="results-week"><option value="ALL">All weeks</option></select>
          </label>
          <label class="filter-control">Day of week
            <select id="results-day">
              <option value="ALL">All days</option>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
              <option value="Sunday">Sunday</option>
            </select>
          </label>
          <label class="filter-control search-control">Search wrestler, college or event
            <input id="results-search" type="search" placeholder="Start typing a wrestler, college or event" autocomplete="off">
          </label>
        </div>
      </section>

      <section class="panel results-panel">
        <div class="panel-heading results-panel-heading">
          <div><p class="eyebrow">Current season only</p><h2 id="results-title">Event Results</h2></div>
          <span class="record-pill" id="results-count">Loading</span>
        </div>
        <div id="results-root" aria-live="polite">
          <div class="state-card page-state"><span class="spinner" aria-hidden="true"></span><p>Loading results…</p></div>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="js/config.js"></script><script src="js/api.js?v=3.9.7"></script><script src="js/site.js?v=3.9.7"></script><script src="js/results.js?v=3.7.2"></script>
  </body>
</html>
