<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sim Wrestling customer accounts">
<title>Create Account | Sim Wrestling</title><link rel="stylesheet" href="assets/styles.css?v=5.1.0"></head>
<body data-page="register"><div data-site-header></div>
<main class="page-shell auth-layout"><section class="panel auth-panel">
<p class="eyebrow">SIM WRESTLING · CUSTOMER ACCOUNTS</p><h1>Create Account</h1><p class="auth-intro">Create your free Sim Wrestling account. Team requests and billing will be available in a later release.</p>
<form data-auth-form ><label class="auth-field">Display name<input name="display_name" type="text" autocomplete="nickname" required minlength="3" maxlength="30" pattern="[A-Za-z0-9 _-]{3,30}"></label><label class="auth-field">Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label class="auth-field">New password<input name="password" type="password" autocomplete="new-password" required minlength="12"></label><label class="auth-field">Confirm password<input name="confirm_password" type="password" autocomplete="new-password" required minlength="12"></label><button class="auth-button" type="submit" data-label="Create Account">Create Account</button></form><div class="auth-links"><a href="login.html">Already have an account? Sign in</a></div>
<p class="auth-status" role="status" aria-live="polite" data-auth-status hidden></p>
</section></main><div data-site-footer></div>
<script src="js/site.js?v=5.1.0"></script><script src="js/auth.js?v=4.0.0"></script><script src="js/auth-pages.js?v=4.0.0"></script>
</body></html>
