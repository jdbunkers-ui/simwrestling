<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The complete eight-week Sim Wrestling league schedule.">
    <title>Schedule | Sim Wrestling</title>
    <link rel="stylesheet" href="assets/styles.css?v=3.3.0">
  </head>
  <body data-page="schedule">
    <div data-site-header></div>
    <main class="page-shell">
      <section class="page-heading schedule-heading">
        <div><p class="eyebrow" id="schedule-season">Current season</p><h1>League Schedule</h1><p>Follow every high-school and college event across the rolling eight-week season.</p></div>
        <div class="schedule-filters" aria-label="Schedule filters">
          <label class="filter-control">Level<select id="schedule-level"><option value="ALL">All levels</option><option value="HIGH_SCHOOL">High School</option><option value="COLLEGE">College</option></select></label>
          <label class="filter-control">State<select id="schedule-state"><option value="ALL">All states</option></select></label>
        </div>
      </section>
      <section class="league-clock panel" id="league-clock" aria-live="polite"><div class="state-card"><span class="spinner" aria-hidden="true"></span><p>Loading the league clock…</p></div></section>
      <nav class="week-rail" id="week-rail" aria-label="Season weeks"></nav>
      <section id="schedule-root" aria-live="polite"><div class="state-card page-state"><span class="spinner" aria-hidden="true"></span><p>Loading scheduled events…</p></div></section>
    </main>
    <div data-site-footer></div>
    <script src="js/config.js"></script><script src="js/api.js?v=3.3.0"></script><script src="js/site.js?v=3.3.0"></script><script src="js/schedule.js?v=3.3.0"></script>
  </body>
</html>
