<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sim Wrestling customer accounts">
<title>My Account | Sim Wrestling</title><link rel="stylesheet" href="assets/styles.css?v=4.0.0"></head>
<body data-page="account"><div data-site-header></div>
<main class="page-shell auth-layout"><section class="panel auth-panel">
<p class="eyebrow">SIM WRESTLING · CUSTOMER ACCOUNTS</p><h1>My Account</h1><p class="auth-intro">Your customer profile and authentication status.</p>
<div data-account-signed-out hidden><p>Please sign in to view your account.</p><a href="login.html">Sign In</a></div>
<div data-account-signed-in hidden><p><strong>Email:</strong> <span data-account-email></span></p>
<p class="auth-small">Your account does not have a team assignment or subscription yet.</p>
<form data-account-form><label class="auth-field">Display name<input data-account-display name="display_name" autocomplete="nickname" required minlength="3" maxlength="30" pattern="[A-Za-z0-9 _-]{3,30}"></label>
<button class="auth-button" type="submit" data-label="Save Display Name">Save Display Name</button></form>
<button type="button" class="auth-button auth-button-secondary" data-sign-out>Sign Out</button></div><div class="auth-links"><a href="index.html">Return to coaching preview</a></div>
<p class="auth-status" role="status" aria-live="polite" data-auth-status hidden></p>
</section></main><div data-site-footer></div>
<script src="js/site.js?v=4.0.0"></script><script src="js/auth.js?v=4.0.0"></script><script src="js/auth-pages.js?v=4.0.0"></script>
</body></html>
